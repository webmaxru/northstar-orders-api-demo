name: Publish Evidence

on:
  workflow_run:
    workflows: ["Governed Change"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Exact completed Governed Change run ID
        required: true
        type: string
      source-run-attempt:
        description: Exact source workflow attempt number
        required: true
        type: string
      parent-pr-number:
        description: Merged parent pull request number (issue #24 bootstrap only)
        required: true
        type: string
      bootstrap-plan-pr-number:
        description: Independently approved issue #24 plan PR number
        required: true
        type: string
      bootstrap-plan-head-sha:
        description: Immutable head SHA of the approved issue #24 plan PR
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || inputs.parent-pr-number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  publish:
    if: >-
      (
        github.event_name == 'workflow_run' &&
        (github.event.workflow_run.event == 'pull_request' ||
        github.event.workflow_run.event == 'pull_request_review')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        github.actor == vars.SYSTEM_MAINTENANCE_DISPATCH_APP_LOGIN
      )
    runs-on: ubuntu-latest
    environment: trusted-publisher
    outputs:
      authority_changed: ${{ steps.authority.outputs.changed }}
      pull_request: ${{ steps.resolve.outputs.pull_request }}
      report_decision: ${{ steps.decision.outputs.value }}
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.parent-pr-number }}
      NORTHSTAR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      NORTHSTAR_RUN_ID: ${{ github.event.workflow_run.id || inputs.source-run-id }}
      NORTHSTAR_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.source-run-attempt }}
      NORTHSTAR_TRUSTED_PUBLISHER_APP_ID: ${{ vars.TRUSTED_PUBLISHER_APP_ID }}
      NORTHSTAR_TRUSTED_PUBLISHER_APP_LOGIN: ${{ vars.TRUSTED_PUBLISHER_APP_LOGIN }}
      NORTHSTAR_DISPATCH_APP_ID: ${{ vars.SYSTEM_MAINTENANCE_DISPATCH_APP_ID }}
      NORTHSTAR_DISPATCH_APP_LOGIN: ${{ vars.SYSTEM_MAINTENANCE_DISPATCH_APP_LOGIN }}
    steps:
      # workflow_run executes trusted default-branch code. Never check out or
      # execute the pull-request branch in this write-capable job.
      - uses: actions/checkout@v7
        with:
          # CUSTOMIZE to the exact protected default branch; never a PR/event ref.
          # A literal makes the trusted checkout boundary inspectable by scanners.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: publisher-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.TRUSTED_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.TRUSTED_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-administration: read
          permission-contents: read
          permission-environments: read
          permission-issues: write
          permission-pull-requests: write
          permission-organization-secrets: ${{ github.event.repository.owner.type == 'Organization' && 'read' || '' }}
          permission-secrets: read
          permission-statuses: write
      # This token is restricted to read-only hosted-control metadata queries.
      - id: controls-token
        name: Mint a read-only repository-controls token
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.TRUSTED_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.TRUSTED_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-administration: read
          permission-environments: read
          permission-organization-secrets: ${{ github.event.repository.owner.type == 'Organization' && 'read' || '' }}
          permission-secrets: read
      - id: dispatcher-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SYSTEM_MAINTENANCE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SYSTEM_MAINTENANCE_DISPATCH_APP_PRIVATE_KEY }}
          permission-actions: write
      - run: npm ci
      - id: resolve
        name: Resolve the exact source run, PR, plan, and artifacts
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          NORTHSTAR_SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source-run-id }}
          NORTHSTAR_SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.source-run-attempt }}
          NORTHSTAR_PARENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.parent-pr-number }}
          NORTHSTAR_BOOTSTRAP_PLAN_PR_NUMBER: ${{ inputs.bootstrap-plan-pr-number }}
          NORTHSTAR_BOOTSTRAP_PLAN_HEAD_SHA: ${{ inputs.bootstrap-plan-head-sha }}
          NORTHSTAR_MIGRATION_MODE: ${{ github.event_name == 'workflow_dispatch' && 'bootstrap-migration' || '' }}
          NORTHSTAR_DISPATCH_APP_LOGIN: ${{ vars.SYSTEM_MAINTENANCE_DISPATCH_APP_LOGIN }}
        run: node scripts/resolve-workflow-run.mjs
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact_ids }}
          path: incoming-evidence
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.source_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
      - run: node scripts/import-evidence-artifacts.mjs --from incoming-evidence
      - env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: npm run contract:from-pr -- --pr "$PR_NUMBER"
      - env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: node scripts/import-workflow-results.mjs --run "$NORTHSTAR_RUN_ID"
      - name: Re-evaluate trusted plan, approval, scope, review, and validation authority
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          set +e

          rm -f artifacts/candidate-plan.json artifacts/approved-plan.json artifacts/checks/plan-approval.json
          node scripts/check-plan.mjs --pr "$PR_NUMBER" --expected-head "$NORTHSTAR_HEAD_SHA"
          PLAN_STATUS=$?
          if [ "$PLAN_STATUS" -eq 0 ] && [ -f artifacts/plan.json ]; then
            cp artifacts/plan.json artifacts/candidate-plan.json
          fi

          ISSUE=$(node -p "require('./artifacts/task-contract.json').source.issue")
          node scripts/select-execution-plan.mjs \
            --issue "$ISSUE" \
            --pr "$PR_NUMBER" \
            --expected-head "$NORTHSTAR_HEAD_SHA" \
            --expected-plan artifacts/candidate-plan.json \
            --record-approval
          SELECTION_STATUS=$?
          node scripts/evidence-record.mjs \
            --id plan-contract \
            --job plan-contract \
            --category policy \
            --status "$([ "$PLAN_STATUS" -eq 0 ] && [ "$SELECTION_STATUS" -eq 0 ] && echo pass || echo fail)" \
            --artifact artifacts/candidate-plan.json

          node scripts/check-scope.mjs --pr "$PR_NUMBER" --expected-head "$NORTHSTAR_HEAD_SHA"
          SCOPE_STATUS=$?
          node scripts/evidence-record.mjs \
            --id scope-policy \
            --job scope-policy \
            --category policy \
            --status "$([ "$SCOPE_STATUS" -eq 0 ] && echo pass || echo fail)" \
            --artifact artifacts/scope-report.json

          node scripts/check-human-review.mjs --pr "$PR_NUMBER" --expected-head "$NORTHSTAR_HEAD_SHA"
          REVIEW_STATUS=$?
          node scripts/evidence-record.mjs \
            --id human-review \
            --job human-review \
            --category approval \
            --status "$([ "$REVIEW_STATUS" -eq 0 ] && echo pass || echo fail)"

          node scripts/check-validation-authority.mjs --pr "$PR_NUMBER" --expected-head "$NORTHSTAR_HEAD_SHA"
          AUTHORITY_STATUS=$?
          node scripts/evidence-record.mjs \
            --id validation-authority \
            --job validation-authority \
            --category policy \
            --status "$([ "$AUTHORITY_STATUS" -eq 0 ] && echo pass || echo fail)" \
            --artifact artifacts/validation-authority-report.json
          exit 0
      - id: authority
        if: always()
        name: Classify validation-authority changes
        run: |
          CHANGED=$(node -e "
            try {
              const report = require('./artifacts/validation-authority-report.json');
              process.stdout.write(String(
                report.schema === 'northstar/validation-authority-report/1' &&
                report.headSha === process.env.NORTHSTAR_HEAD_SHA &&
                report.changedAuthority.length > 0
              ));
            } catch {
              process.stdout.write('unknown');
            }
          ")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
      - id: execution-plan
        name: Reassert immutable pull-request identity
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          node scripts/resolve-workflow-pr.mjs --sha "$NORTHSTAR_HEAD_SHA"
          npm run contract:from-pr -- --pr "$PR_NUMBER"
          node scripts/check-plan.mjs --pr "$PR_NUMBER" --expected-head "$NORTHSTAR_HEAD_SHA"
          node scripts/select-execution-plan.mjs \
            --pr "$PR_NUMBER" \
            --expected-head "$NORTHSTAR_HEAD_SHA" \
            --expected-plan artifacts/plan.json \
            --record-approval
      - id: controls-audit
        if: always()
        name: Revalidate repository controls with read-only App token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.controls-token.outputs.token }}
        run: |
          set +e
          npm run governance:online
          CONTROLS_STATUS=$?
          node scripts/evidence-record.mjs \
            --id repository-controls \
            --job repository-controls \
            --category policy \
            --status "$([ "$CONTROLS_STATUS" -eq 0 ] && echo pass || echo fail)" \
            --artifact artifacts/repository-controls-report.json
          RECORD_STATUS=$?
          if [ "$RECORD_STATUS" -ne 0 ]; then
            echo "Unable to record trusted repository-controls evidence."
            exit "$RECORD_STATUS"
          fi
          exit "$CONTROLS_STATUS"
      - id: report
        if: always()
        continue-on-error: true
        env:
          SELECTION_OUTCOME: ${{ steps.execution-plan.outcome }}
          PLAN_PATH: ${{ steps.execution-plan.outputs.plan_path }}
        run: |
          if [ "$SELECTION_OUTCOME" != "success" ]; then
            rm -f artifacts/plan.json artifacts/approved-plan.json artifacts/candidate-plan.json
            PLAN_PATH=artifacts/plan.json
          fi
          node scripts/build-execution-report.mjs --hosted --plan "$PLAN_PATH"
      - id: decision
        if: always() && hashFiles('artifacts/report.json') != ''
        run: |
          VALUE=$(node -p "require('./artifacts/report.json').decision")
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
      - if: always() && hashFiles('artifacts/report.json') != ''
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: node scripts/publish-evidence.mjs --pr "$PR_NUMBER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: northstar-trusted-execution-report
          path: artifacts/report.json
          if-no-files-found: error
          retention-days: 90
      - name: Bind maintenance evidence to trusted runs
        if: always() && steps.authority.outputs.changed == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/maintenance-manifest.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.authority.outputs.changed == 'true'
        with:
          name: northstar-system-maintenance-evidence
          path: |
            artifacts/task-contract.json
            artifacts/candidate-plan.json
            artifacts/approved-plan.json
            artifacts/unit-junit.xml
            artifacts/acceptance-junit.xml
            artifacts/dependency-audit.json
            artifacts/governance-report.json
            artifacts/repository-controls-report.json
            artifacts/merge-report.json
            artifacts/scope-report.json
            artifacts/validation-authority-report.json
            artifacts/maintenance-manifest.json
            artifacts/checks
            artifacts/codeql
          if-no-files-found: warn
          retention-days: 90
      - if: always() && hashFiles('artifacts/report.json') != ''
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: node scripts/publish-acceptance-status.mjs
      - if: always() && hashFiles('artifacts/trusted-acceptance-status.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: northstar-trusted-acceptance-status
          path: |
            artifacts/trusted-acceptance-status.json
            artifacts/resolved-workflow-run.json
          if-no-files-found: error
          retention-days: 90
      - name: Dispatch protected system-maintenance approval
        if: >-
          steps.authority.outputs.changed == 'true' &&
          steps.decision.outputs.value == 'ready_for_review'
        env:
          GH_TOKEN: ${{ steps.dispatcher-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test -n "$GH_TOKEN"
          gh workflow run system-maintenance-approval.yml \
            --ref "$DEFAULT_BRANCH" \
            -f pull-request="$PR_NUMBER" \
            -f head-sha="$NORTHSTAR_HEAD_SHA" \
            -f evidence-run-id="${{ github.run_id }}" \
            -f evidence-run-attempt="${{ github.run_attempt }}" \
            -f source-run-id="$NORTHSTAR_RUN_ID" \
            -f source-run-attempt="$NORTHSTAR_RUN_ATTEMPT" \
            -f migration-mode="$NORTHSTAR_MIGRATION_MODE" \
            -f bootstrap-plan-pr-number="$NORTHSTAR_BOOTSTRAP_PLAN_PR_NUMBER" \
            -f bootstrap-plan-head-sha="$NORTHSTAR_BOOTSTRAP_PLAN_HEAD_SHA"
      - name: Dispatch the approved browser-plan canary
        if: steps.execution-plan.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          NORTHSTAR_DISPATCH_TOKEN: ${{ steps.dispatcher-token.outputs.token }}
        run: node scripts/dispatch-browser-plan-canary.mjs

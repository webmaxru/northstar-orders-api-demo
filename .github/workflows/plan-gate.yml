name: Plan Gate

# No `branches:` filter. Learn's snippet scopes the gate to `main`, but that
# filter matches the PR's BASE branch - and this repository stacks demo PRs onto
# each other, so a base filter silently skipped the gate on the very PR that
# introduced it. A plan is required for every pull request, not only the ones
# aimed at the default branch.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `edited` is in the trigger list on purpose: the plan lives in the pull
      # request description, so editing the description must re-run the gate.
      - name: Require a reviewable plan in the PR description
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-plan.mjs --pr ${{ github.event.pull_request.number }}

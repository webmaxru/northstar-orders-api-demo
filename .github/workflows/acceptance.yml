name: Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northstar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d northstar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/northstar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit:ci
      - run: npm run test:acceptance:ci
      - name: Build execution report
        if: always()
        run: node scripts/build-execution-report.mjs
      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: execution-report
          path: artifacts/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-test-evidence
          path: artifacts/acceptance-junit.xml
          if-no-files-found: warn

name: Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northstar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d northstar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/northstar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit:ci
      - run: npm run test:acceptance:ci
      - name: Resolve the task contract
        if: always()
        run: |
          # The contract lives in the issue. Use it when the pull request names
          # one; otherwise fall back to the seed file so the gate still runs.
          # The resolved contract records which source was used.
          ISSUE=$(gh pr view "$PR" --json body --jq '.body' 2>/dev/null | grep -oiE '(closes|fixes|resolves) #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$ISSUE" ]; then
            node scripts/fetch-task-contract.mjs --issue "$ISSUE"
          else
            node scripts/fetch-task-contract.mjs --file docs/work-items/WI-1842.issue.md
          fi
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
      - name: Build execution report
        if: always()
        run: node scripts/build-execution-report.mjs
      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: execution-report
          path: artifacts/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-test-evidence
          path: artifacts/acceptance-junit.xml
          if-no-files-found: warn

